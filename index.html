<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืม-คืนพาสปอร์ตและติดตามเอกสารแรงงาน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- ส่วนหัวเว็บไซต์ -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">ระบบยืม-คืนพาสปอร์ตและติดตามเอกสารแรงงาน</h1>
            <div id="connection-status" class="bg-amber-500 text-white text-xs px-3 py-1 rounded-full">
                กำลังเชื่อมต่อ Server...
            </div>
        </div>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">รายชื่อพาสปอร์ตทั้งหมด</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">พนักงาน / รูปบัตร</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เลขพาสปอร์ต / ที่เก็บ</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">วันหมดอายุเอกสารหลัก</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะปัจจุบัน</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="passport-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ผ่าน JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script สำหรับดึงข้อมูล API -->
    <script>
        async function fetchPassports() {
            const statusBadge = document.getElementById('connection-status');
            try {
                // ใช้เส้นทางสั้น /api/passports เพื่อรองรับทั้ง Localhost และ Render (HTTPS)
                const response = await fetch('/api/passports');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                
                // เปลี่ยนสถานะเมื่อเชื่อมต่อสำเร็จ
                statusBadge.textContent = 'เชื่อมต่อ Server สำเร็จ';
                statusBadge.className = 'bg-emerald-500 text-white text-xs px-3 py-1 rounded-full';

                const tableBody = document.getElementById('passport-table-body');
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">ยังไม่มีข้อมูลในระบบ</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.holder_name || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.passport_no || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.expiry_date || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">ปกติ</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">--</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Failed to load passports', error);
                statusBadge.textContent = 'ไม่สามารถเชื่อมต่อกับ Server ได้';
                statusBadge.className = 'bg-amber-500 text-white text-xs px-3 py-1 rounded-full';
            }
        }

        // เรียกใช้งานฟังก์ชันเมื่อโหลดหน้าเว็บ
        fetchPassports();
    </script>
</body>
</html>
